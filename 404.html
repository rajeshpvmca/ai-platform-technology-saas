<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | AI Platform</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* 404 Specific Animations and Styles */
    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #9C7DFF 0%, #407BFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0;
      position: relative;
      display: inline-block;
    }
    
    .glitch-wrapper {
      position: relative;
      display: inline-block;
    }
    
    .glitch-wrapper::before,
    .glitch-wrapper::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bg-dark, #0B0E2A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.5;
      z-index: -1;
    }
    
    .glitch-wrapper::before {
      left: 4px;
      text-shadow: -2px 0 #9C7DFF;
      animation: glitch-anim 2s infinite linear alternate-reverse;
    }
    
    .glitch-wrapper::after {
      left: -4px;
      text-shadow: -2px 0 #407BFF;
      animation: glitch-anim-2 3s infinite linear alternate-reverse;
    }
    
    @keyframes glitch-anim {
      0% { clip-path: inset(20% 0 80% 0); }
      20% { clip-path: inset(60% 0 10% 0); }
      40% { clip-path: inset(40% 0 50% 0); }
      60% { clip-path: inset(80% 0 5% 0); }
      80% { clip-path: inset(10% 0 70% 0); }
      100% { clip-path: inset(30% 0 20% 0); }
    }
    
    @keyframes glitch-anim-2 {
      0% { clip-path: inset(10% 0 60% 0); }
      20% { clip-path: inset(80% 0 5% 0); }
      40% { clip-path: inset(30% 0 20% 0); }
      60% { clip-path: inset(70% 0 10% 0); }
      80% { clip-path: inset(40% 0 50% 0); }
      100% { clip-path: inset(20% 0 30% 0); }
    }

    .orbital-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(156, 125, 255, 0.2);
      border-radius: 50%;
      z-index: -1;
    }
    
    .ring-1 { width: 300px; height: 300px; animation: rotate 20s linear infinite; }
    .ring-2 { width: 450px; height: 450px; animation: rotate 30s linear infinite reverse; border-color: rgba(64, 123, 255, 0.1); }
    .ring-3 { width: 600px; height: 600px; animation: rotate 40s linear infinite; border-style: dashed; }
    
    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #9C7DFF;
      border-radius: 50%;
      box-shadow: 0 0 10px #9C7DFF, 0 0 20px #9C7DFF;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .ai-brain-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(156, 125, 255, 0.15) 0%, rgba(11, 14, 42, 0) 50%);
      z-index: -2;
      pointer-events: none;
    }
  </style>
</head>
<body style="background-color: var(--bg-dark, #0B0E2A); color: #fff;">


  <!-- Main Content -->
  <main style="min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding-top: 80px;">
    
    <!-- Background Elements -->
    <div class="ai-brain-bg"></div>
    <div class="orbital-ring ring-1"><div class="particle"></div></div>
    <div class="orbital-ring ring-2"><div class="particle" style="background: #407BFF; box-shadow: 0 0 10px #407BFF;"></div></div>
    <div class="orbital-ring ring-3"></div>
    
    <div class="container position-relative z-1 text-center px-3">
      <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-6">
          
          <div class="glitch-wrapper mb-2">
            <h1 class="error-code">404</h1>
          </div>
          
          <h2 class="fw-bold mb-3" style="font-size: clamp(1.5rem, 4vw, 2.5rem);">Neural Link Disconnected</h2>
          
          <p class="text-white-50 mb-5" style="font-size: clamp(0.9rem, 2vw, 1.1rem); max-width: 500px; margin-left: auto; margin-right: auto; line-height: 1.6;">
            The model you're looking for doesn't exist in our current dimension, or the URL has decayed. Let's redirect your neural pathways back to safety.
          </p>
          
          <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a href="index.html" class="btn btn-custom-primary px-4 py-3 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-house"></i> Back to Home
            </a>
            <button onclick="window.history.back()" class="btn btn-custom-outlined px-4 py-3 d-flex align-items-center justify-content-center gap-2">
              <i class="bi bi-arrow-left"></i> Go Back
            </button>
          </div>
          
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Main JS (loads header/footer) -->
  <script src="js/main.js"></script>
  
  
</body>
</html>
