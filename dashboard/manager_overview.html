<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Team Overview</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .glass-card {
            background: rgba(14, 21, 62, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-color: rgba(255, 255, 255, 0.8);
            --bs-table-border-color: rgba(255, 255, 255, 0.1);
        }
        .table-dark th {
            color: #fff;
            font-weight: 600;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .bg-primary-soft { background: rgba(156, 125, 255, 0.15); color: #9C7DFF; border: 1px solid rgba(156, 125, 255, 0.3); }
        .bg-success-soft { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-warning-soft { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-danger-soft { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .btn-custom {
            background: linear-gradient(90deg, #7A4AF6 0%, #407BFF 100%);
            border: none;
            color: #fff;
        }
        
        @media (max-width: 576px) {
            body { padding: 1rem; }
            .glass-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container-fluid px-0">
        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Team Overview</h4>
            <div><button class="btn btn-custom btn-sm">Invite Member</button></div>
        </div>
        
        <div class="row g-3 mb-4">
            <div class="col-sm-4"><div class="glass-card h-100 mb-0"><div class="text-white-50 small mb-2">Team Members</div><h3 class="mb-0 fw-bold">12</h3></div></div>
            <div class="col-sm-4"><div class="glass-card h-100 mb-0"><div class="text-white-50 small mb-2">Active Projects</div><h3 class="mb-0 fw-bold">8</h3></div></div>
            <div class="col-sm-4"><div class="glass-card h-100 mb-0"><div class="text-white-50 small mb-2">API Usage</div><h3 class="mb-0 fw-bold">84%</h3></div></div>
        </div>
        <div class="glass-card">
            <h6 class="fw-bold mb-4">Team Activity</h6>
            <div id="activityChart"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var opt = { series: [{name: 'Commits', data: [10, 41, 35, 51, 49, 62, 69, 91, 148]}], chart: { height: 300, type: 'line', toolbar: {show: false}, background: 'transparent' }, colors: ['#407BFF'], stroke: { curve: 'smooth', width: 3 }, xaxis: { categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'], labels: { style: { colors: 'rgba(255,255,255,0.5)' } }, axisBorder: {show: false}, axisTicks: {show: false} }, yaxis: { labels: { style: { colors: 'rgba(255,255,255,0.5)' } } }, grid: { borderColor: 'rgba(255,255,255,0.05)', strokeDashArray: 4 }, theme: { mode: 'dark' } };
        new ApexCharts(document.querySelector("#activityChart"), opt).render();
        </script>
</body>
</html>
