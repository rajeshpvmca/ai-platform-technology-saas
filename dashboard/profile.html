<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>My Profile</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link href="../css/style.css" rel="stylesheet" />
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .glass-card {
            background: rgba(14, 21, 62, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-color: rgba(255, 255, 255, 0.8);
            --bs-table-border-color: rgba(255, 255, 255, 0.1);
        }
        
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: #9C7DFF;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(156, 125, 255, 0.25);
        }
        
        .nav-pills .nav-link {
            color: rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .nav-pills .nav-link.active, .nav-pills .show>.nav-link {
            color: #fff;
            background: linear-gradient(90deg, #7A4AF6 0%, #407BFF 100%);
        }

        .avatar-upload {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7A4AF6 0%, #407BFF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: white;
            position: relative;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        .avatar-upload:hover::after {
            content: '\F4F6';
            font-family: 'bootstrap-icons';
            position: absolute;
            background: rgba(0,0,0,0.5);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        @media (max-width: 576px) {
            body { padding: 1rem; }
            .glass-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container-fluid px-0">
        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">My Profile</h4>
            <div><button class="btn btn-custom-primary btn-sm" onclick="window.top.location.href='../404.html'"><i class="bi bi-save"></i> Save Profile</button></div>
        </div>
        
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="glass-card text-center text-lg-start">
                    <div class="d-flex flex-column flex-lg-row align-items-center gap-4">
                        <div class="avatar-upload mx-auto mx-lg-0" id="profileAvatar">R</div>
                        <div>
                            <h5 class="fw-bold mb-1" id="profileName">Rajesh P</h5>
                            <p class="text-white-50 small mb-2" id="profileRole">Admin</p>
                            <button class="btn btn-sm btn-custom-outlined" onclick="window.top.location.href='../404.html'">Change Photo</button>
                        </div>
                    </div>
                </div>
                
                <div class="glass-card">
                    <h6 class="fw-bold mb-3">Account Security</h6>
                    <div class="d-flex align-items-center justify-content-between mb-3 border-bottom border-secondary pb-3">
                        <div>
                            <p class="mb-0 fw-bold small">Two-Factor Auth</p>
                            <p class="text-white-50 small mb-0">Secure your account</p>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="tfaSwitch">
                        </div>
                    </div>
                    <button class="btn btn-sm btn-outline-light w-100" data-bs-toggle="modal" data-bs-target="#passwordModal"><i class="bi bi-key"></i> Change Password</button>
                </div>
            </div>
            
            <div class="col-lg-8">
                <div class="glass-card">
                    <h6 class="fw-bold mb-4">Personal Information</h6>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-white-50">Full Name</label>
                                <input type="text" class="form-control" id="inputName" value="Rajesh P">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-white-50">Email Address</label>
                                <input type="email" class="form-control" id="inputEmail" value="rajeshpvmca@gmail.com" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-white-50">Phone Number</label>
                                <input type="text" class="form-control" placeholder="+1 (555) 000-0000">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-white-50">Company</label>
                                <input type="text" class="form-control" value="Stackly">
                            </div>
                            <div class="col-12">
                                <label class="form-label small text-white-50">Bio</label>
                                <textarea class="form-control" rows="4" placeholder="Tell us about yourself..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Password Modal -->
        <div class="modal fade" id="passwordModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="background: rgba(14, 21, 62, 0.95); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px);">
                    <div class="modal-header border-secondary">
                        <h5 class="modal-title text-white">Change Password</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label small text-white-50">Current Password</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-white-50">New Password</label>
                            <input type="password" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-white-50">Confirm New Password</label>
                            <input type="password" class="form-control">
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-custom-outlined" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-custom-primary" onclick="window.top.location.href='../404.html'">Update Password</button>
                    </div>
                </div>
            </div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
            // Attempt to load user info from parent dashboard
            window.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'DASH_USER') {
                    const user = event.data.user;
                    if(user) {
                        document.getElementById('profileName').textContent = user.name;
                        document.getElementById('inputName').value = user.name;
                        document.getElementById('inputEmail').value = user.email;
                        document.getElementById('profileRole').textContent = user.role || 'User';
                        document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase();
                    }
                }
            });
        </script>
</body>
</html>
