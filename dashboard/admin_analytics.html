<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Platform Analytics</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1.5rem;
        }
        .glass-card {
            background: rgba(14, 21, 62, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .table-dark {
            --bs-table-bg: transparent;
            --bs-table-color: rgba(255, 255, 255, 0.8);
            --bs-table-border-color: rgba(255, 255, 255, 0.1);
        }
        .table-dark th {
            color: #fff;
            font-weight: 600;
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .bg-primary-soft { background: rgba(156, 125, 255, 0.15); color: #9C7DFF; border: 1px solid rgba(156, 125, 255, 0.3); }
        .bg-success-soft { background: rgba(16, 185, 129, 0.15); color: #10B981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .bg-warning-soft { background: rgba(245, 158, 11, 0.15); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.3); }
        .bg-danger-soft { background: rgba(239, 68, 68, 0.15); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        .btn-custom {
            background: linear-gradient(90deg, #7A4AF6 0%, #407BFF 100%);
            border: none;
            color: #fff;
        }
        
        @media (max-width: 576px) {
            body { padding: 1rem; }
            .glass-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container-fluid px-0">
        <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Platform Analytics</h4>
            <div><button class="btn btn-custom btn-sm"><i class="bi bi-download"></i> Export Report</button></div>
        </div>
        
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3"><div class="glass-card h-100 mb-0 d-flex align-items-center gap-3"><div class="stat-icon bg-primary-soft"><i class="bi bi-people"></i></div><div><div class="text-white-50 small">Total Users</div><h3 class="mb-0 fw-bold">12,450</h3></div></div></div>
            <div class="col-sm-6 col-xl-3"><div class="glass-card h-100 mb-0 d-flex align-items-center gap-3"><div class="stat-icon bg-success-soft"><i class="bi bi-currency-dollar"></i></div><div><div class="text-white-50 small">MRR</div><h3 class="mb-0 fw-bold">$45,200</h3></div></div></div>
            <div class="col-sm-6 col-xl-3"><div class="glass-card h-100 mb-0 d-flex align-items-center gap-3"><div class="stat-icon bg-warning-soft"><i class="bi bi-cpu"></i></div><div><div class="text-white-50 small">API Calls</div><h3 class="mb-0 fw-bold">1.2M</h3></div></div></div>
            <div class="col-sm-6 col-xl-3"><div class="glass-card h-100 mb-0 d-flex align-items-center gap-3"><div class="stat-icon bg-danger-soft"><i class="bi bi-bug"></i></div><div><div class="text-white-50 small">Error Rate</div><h3 class="mb-0 fw-bold">0.02%</h3></div></div></div>
        </div>
        <div class="row g-3">
            <div class="col-lg-8"><div class="glass-card"><h6 class="fw-bold mb-4">Revenue & Growth</h6><div id="growthChart"></div></div></div>
            <div class="col-lg-4"><div class="glass-card"><h6 class="fw-bold mb-4">Users by Plan</h6><div id="planChart"></div></div></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        var opt1 = { series: [{name: 'Revenue', data: [31, 40, 28, 51, 42, 109, 100]}, {name: 'Users', data: [11, 32, 45, 32, 34, 52, 41]}], chart: { height: 300, type: 'area', toolbar: {show: false}, background: 'transparent' }, colors: ['#9C7DFF', '#407BFF'], fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 100] } }, dataLabels: { enabled: false }, stroke: { curve: 'smooth', width: 2 }, xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'], labels: { style: { colors: 'rgba(255,255,255,0.5)' } }, axisBorder: {show: false}, axisTicks: {show: false} }, yaxis: { labels: { style: { colors: 'rgba(255,255,255,0.5)' } } }, grid: { borderColor: 'rgba(255,255,255,0.05)', strokeDashArray: 4 }, theme: { mode: 'dark' } };
        new ApexCharts(document.querySelector("#growthChart"), opt1).render();

        var opt2 = { series: [44, 55, 13], labels: ['Pro', 'Enterprise', 'Free'], chart: { type: 'donut', height: 300, background: 'transparent' }, colors: ['#9C7DFF', '#407BFF', '#10B981'], stroke: { show: false }, dataLabels: { enabled: false }, legend: { position: 'bottom', labels: { colors: '#fff' } }, theme: { mode: 'dark' } };
        new ApexCharts(document.querySelector("#planChart"), opt2).render();
        </script>
</body>
</html>
